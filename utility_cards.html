<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Utility Cards — All Colors</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 16px; background: #0f1419; color: #e7e9ea; }
h1 { color: #1d9bf0; }
.filter { margin: 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
button { background: #1d9bf0; color: #fff; border: none; padding: 7px 12px; margin: 3px; border-radius: 20px; cursor: pointer; font-size: 0.9em; }
button.active { background: #00ba7c; }
button.secondary { background: #2f3336; }
.card { background: #16181c; border: 1px solid #2f3336; border-radius: 12px; padding: 14px 16px; margin: 10px 0; display: flex; gap: 12px; }
.card.minimized .card-text { display: none; }
.card.hidden { display: none !important; }
.thumb { width: 60px; height: 84px; object-fit: cover; border-radius: 6px; cursor: pointer; flex-shrink: 0; border: 1px solid #2f3336; }
.thumb:hover { opacity: 0.85; }
.card-body { flex: 1; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-title { flex: 1; }
.card-id { font-weight: 700; color: #1d9bf0; }
.card-name { font-size: 1.05em; font-weight: 600; }
.meta { color: #71767b; font-size: 0.9em; white-space: nowrap; }
.badges { margin-left: 8px; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 12px; font-size: 0.68em; font-weight: 700; margin-right: 3px; }
.badge.REST { background: #00ba7c; color: #000; }
.badge.FREEZE { background: #f4212e; color: #fff; }
.badge.DON { background: #7856ff; color: #fff; }
.badge.RESTAND_DON { background: #ffd400; color: #000; }
.badge.DRAW { background: #1d9bf0; color: #fff; }
.badge.BLOCKER { background: #e7e9ea; color: #000; }
.badge.RUSH { background: #ff6b00; color: #fff; }
.badge.UNBLOCKABLE { background: #ff2d55; color: #fff; }
.badge.DOUBLE_ATTACK { background: #bf5af2; color: #fff; }
.badge.COUNTER2000 { background: #00ba7c; color: #000; }
.badge.COUNTER1000 { background: #1d9bf0; color: #fff; }
.card-text { margin-top: 8px; white-space: pre-wrap; line-height: 1.45; }
.card-actions { display: flex; gap: 6px; }
.card-actions button { padding: 4px 10px; font-size: 0.8em; border-radius: 16px; background: #2f3336; }
.note { background: #1a1f26; padding: 12px; border-left: 4px solid #1d9bf0; margin: 16px 0; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
.modal.open { display: flex; }
.modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
.modal-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 36px; cursor: pointer; }
</style>
</head>
<body>
<h1>Utility Cards</h1>
<p><a href="index.html" style="color:#1d9bf0; text-decoration:none;">← Playbook</a></p>
<p><a href="https://github.com/JakeVestal/optcg_playbook" target="_blank" rel="noopener"><img src="https://img.shields.io/badge/GitHub-Repo-181717?style=flat&logo=github" alt="GitHub Repo"></a></p>

<div class="note">
Loads from <code>data/cards.csv</code> (updated nightly from optcgjson). Click thumbnail to expand. − collapses text, × hides a card.
</div>

<div style="margin: 8px 0 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
  <input id="search" type="text" placeholder="Search ID, name, or text..." oninput="applyFilters()" style="flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 20px; border: 1px solid #2f3336; background: #16181c; color: #e7e9ea;">
  <button class="secondary" onclick="clearSearch()">Clear</button>
</div>

<div class="filter" id="color-filter">
  <button onclick="toggleColor(this, 'Green')">Green</button>
  <button onclick="toggleColor(this, 'Red')">Red</button>
  <button onclick="toggleColor(this, 'Blue')">Blue</button>
  <button onclick="toggleColor(this, 'Purple')">Purple</button>
  <button onclick="toggleColor(this, 'Yellow')">Yellow</button>
  <button onclick="toggleColor(this, 'Black')">Black</button>
  <button class="secondary" onclick="clearColors()">All Colors</button>
</div>

<div class="filter" id="tag-filter">
  <button onclick="toggleTag(this, 'REST')">REST</button>
  <button onclick="toggleTag(this, 'FREEZE')">FREEZE</button>
  <button onclick="toggleTag(this, 'DON')">DON</button>
  <button onclick="toggleTag(this, 'RESTAND_DON')">RESTAND_DON</button>
  <button onclick="toggleTag(this, 'DRAW')">DRAW</button>
  <button onclick="toggleTag(this, 'BLOCKER')">BLOCKER</button>
  <button onclick="toggleTag(this, 'RUSH')">RUSH</button>
  <button onclick="toggleTag(this, 'UNBLOCKABLE')">UNBLOCKABLE</button>
  <button onclick="toggleTag(this, 'DOUBLE_ATTACK')">DOUBLE_ATTACK</button>
  <button onclick="toggleTag(this, 'COUNTER2000')">+2000</button>
  <button onclick="toggleTag(this, 'COUNTER1000')">+1000</button>
  <button class="secondary" onclick="clearTags()">Remove Tag Filters</button>
  <button class="secondary" onclick="copyVisible()">Copy visible to OPTCGSim</button>
</div>

<div id="cards"></div>

<div class="modal" id="modal" onclick="closeModal()">
  <span class="modal-close">&times;</span>
  <img id="modal-img" src="" alt="">
</div>

<script>
let allCards = [];
let activeColors = new Set();
let activeTags = new Set();

async function load() {
  const res = await fetch('data/cards.csv');
  const text = await res.text();
  const lines = text.split('\n').slice(1).filter(l => l.trim());
  allCards = lines.map(line => {
    const cols = line.split(','); // simple; real CSV may need better parsing
    // Better: use a proper split that respects quotes
    return parseCSVLine(line);
  }).filter(c => c && c.id);
  render();
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else current += ch;
  }
  result.push(current);
  if (result.length < 11) return null;
  return {
    id: result[0],
    name: result[1],
    category: result[2],
    colors: result[3],
    cost: result[4],
    power: result[5],
    counter: result[6],
    effect: result[7],
    tags: result[8] || '',
    blockIcon: result[9],
    imageUrl: result[10]
  };
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  const search = document.getElementById('search').value.toLowerCase();
  allCards.forEach(c => {
    const colors = (c.colors || '').split('|');
    const tags = (c.tags || '').split(',').filter(Boolean);
    const colorMatch = activeColors.size === 0 || colors.some(col => activeColors.has(col));
    const tagMatch = activeTags.size === 0 || [...activeTags].every(t => tags.includes(t));
    const searchMatch = !search || (c.id + c.name + c.effect).toLowerCase().includes(search);
    if (!colorMatch || !tagMatch || !searchMatch) return;
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = c.id;
    const imgSrc = `https://optcg-api.arjunbansal-ai.workers.dev/images/${c.id}`;
    div.innerHTML = `
      <img class="thumb" src="${imgSrc}" alt="${c.name}" onclick="openModal(this.src)">
      <div class="card-body">
        <div class="card-header">
          <div class="card-title">
            <span class="card-id">${c.id}</span>
            <span class="card-name">${c.name}</span>
            <span class="badges">${tags.map(t => `<span class="badge ${t}">${t}</span>`).join('')}</span>
          </div>
          <div class="meta">${c.category || ''} · ${c.cost || ''}c · ${c.colors}</div>
          <div class="card-actions">
            <button onclick="this.closest('.card').classList.toggle('minimized')">−</button>
            <button onclick="this.closest('.card').classList.add('hidden')">×</button>
          </div>
        </div>
        <div class="card-text">${c.effect || ''}</div>
      </div>`;
    container.appendChild(div);
  });
}

function toggleColor(btn, color) {
  btn.classList.toggle('active');
  if (activeColors.has(color)) activeColors.delete(color); else activeColors.add(color);
  render();
}
function toggleTag(btn, tag) {
  btn.classList.toggle('active');
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  render();
}
function clearColors() { activeColors.clear(); document.querySelectorAll('#color-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearTags() { activeTags.clear(); document.querySelectorAll('#tag-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearSearch() { document.getElementById('search').value = ''; render(); }
function applyFilters() { render(); }
function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function copyVisible() {
  const ids = [...document.querySelectorAll('.card:not(.hidden)')].map(el => el.dataset.id);
  const text = ids.map(id => `1x${id}`).join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Copied ' + ids.length + ' cards'));
}

load();
</script>
</body>
</html>
