name: Update Cards CSV and Rules

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Actions are pinned to exact commits (not movable tags) so their code can't change under us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run update script
        id: update
        # A failure here (e.g. rules fetch) still lets the commit step save whatever
        # did succeed; the job is marked failed at the end so it gets noticed.
        continue-on-error: true
        run: python3 scripts/update_cards.py
      - name: Update TCGplayer prices
        id: prices
        continue-on-error: true
        run: python3 scripts/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cards.csv data/card-changes-log.txt data/tcgplayer.json data/rules/ rules.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: nightly update of cards, rules and TCGplayer prices"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then pushed=1; break; fi
              sleep 5
            done
            if [ "$pushed" != 1 ]; then echo "push failed after 3 attempts"; exit 1; fi
          fi
      - name: Fail if an update step failed
        if: steps.update.outcome == 'failure' || steps.prices.outcome == 'failure'
        run: |
          echo "cards/rules step: ${{ steps.update.outcome }}"
          echo "prices step: ${{ steps.prices.outcome }}"
          exit 1
