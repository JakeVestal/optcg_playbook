<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTCG Utility Cards</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #121a2b;
  --panel-2: #1a2438;
  --text: #e8eef8;
  --muted: #8b9bb4;
  --accent: #e63946;
  --gold: #f4a261;
  --blue: #457b9d;
  --green: #2a9d8f;
  --border: #2a3650;
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: linear-gradient(180deg, #0b1220 0%, #0f1a2e 100%);
  color: var(--text);
  margin: 0;
  padding: 16px 20px 40px;
  max-width: 1400px;
  margin-left: auto;
  margin-right: auto;
}
h1 { color: var(--gold); margin: 0 0 4px; font-size: 1.6em; }
.subtitle { color: var(--muted); margin: 0 0 16px; font-size: 0.9em; }
a { color: #7eb8ff; text-decoration: none; }
a:hover { text-decoration: underline; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
input[type="text"] {
  flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 0.85em;
}
button:hover { background: #243049; }
button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
button.secondary { background: #2a3650; }

.sidebar {
  display: grid; grid-template-columns: 280px 1fr 260px; gap: 16px; margin-top: 16px;
}
@media (max-width: 1100px) {
  .sidebar { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; max-height: 70vh; overflow-y: auto;
}
.panel h3 { margin: 0 0 8px; font-size: 0.95em; color: var(--gold); }

.card {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin: 8px 0; display: flex; gap: 10px;
}
.card.minimized .card-text { display: none; }
.card.hidden { display: none !important; }
.thumb {
  width: 52px; height: 72px; object-fit: cover; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border); flex-shrink: 0;
}
.card-body { flex: 1; min-width: 0; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-id { font-weight: 700; color: #7eb8ff; font-size: 0.9em; }
.card-name { font-weight: 600; }
.block-badge {
  display: inline-block; background: var(--gold); color: #000; font-size: 0.7em;
  font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: 6px;
}
.meta { color: var(--muted); font-size: 0.8em; }
.badges { margin-top: 4px; }
.badge {
  display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 0.65em;
  font-weight: 700; margin-right: 3px; background: #2a3650;
}
.card-text { margin-top: 6px; font-size: 0.85em; line-height: 1.4; white-space: pre-wrap; }
.card-actions { display: flex; gap: 4px; }
.card-actions button { padding: 2px 8px; font-size: 0.75em; }

.side-item {
  font-size: 0.8em; padding: 4px 0; border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.side-item:hover { background: #1e2a42; }
.type-row { display: flex; justify-content: space-between; font-size: 0.8em; padding: 2px 0; }
.type-count { color: var(--gold); }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
.modal.open { display: flex; }
.modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
</style>
</head>
<body>
<h1>OPTCG Utility Cards</h1>
<p class="subtitle">
  <a href="playbook.html">Bonney</a> ·
  <a href="playbooks/zoro.html">Zoro</a> ·
  <a href="playbooks/brook.html">Brook</a> ·
  <a href="playbooks/franky.html">Franky</a> ·
  <a href="playbooks/karoo.html">Karoo</a> ·
  <a href="https://github.com/JakeVestal/optcg_playbook" target="_blank">GitHub</a>
</p>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search ID, name, or text..." oninput="render()">
  <button class="secondary" onclick="clearSearch()">Clear</button>
</div>

<div class="toolbar" id="block-filter">
  <span style="color:var(--muted);font-size:0.85em;">Block:</span>
  <button onclick="toggleBlock(this,'1')">1</button>
  <button onclick="toggleBlock(this,'2')">2</button>
  <button onclick="toggleBlock(this,'3')">3</button>
  <button onclick="toggleBlock(this,'4')">4</button>
  <button onclick="toggleBlock(this,'5')">5</button>
  <button onclick="toggleBlock(this,'X')">X</button>
  <button class="secondary" onclick="clearBlocks()">All Blocks</button>
</div>

<div class="toolbar" id="color-filter">
  <button onclick="toggleColor(this,'Green')">Green</button>
  <button onclick="toggleColor(this,'Red')">Red</button>
  <button onclick="toggleColor(this,'Blue')">Blue</button>
  <button onclick="toggleColor(this,'Purple')">Purple</button>
  <button onclick="toggleColor(this,'Yellow')">Yellow</button>
  <button onclick="toggleColor(this,'Black')">Black</button>
  <button class="secondary" onclick="clearColors()">All Colors</button>
</div>

<div class="toolbar" id="cat-filter">
  <button onclick="toggleCat(this,'LEADER')">Leaders</button>
  <button onclick="toggleCat(this,'CHARACTER')">Characters</button>
  <button onclick="toggleCat(this,'EVENT')">Events</button>
  <button onclick="toggleCat(this,'STAGE')">Stages</button>
  <button class="secondary" onclick="clearCats()">All Types</button>
</div>

<div class="toolbar" id="tag-filter">
  <button onclick="toggleTag(this,'REST')">REST</button>
  <button onclick="toggleTag(this,'FREEZE')">FREEZE</button>
  <button onclick="toggleTag(this,'DON')">DON</button>
  <button onclick="toggleTag(this,'RESTAND_DON')">RESTAND_DON</button>
  <button onclick="toggleTag(this,'DRAW')">DRAW</button>
  <button onclick="toggleTag(this,'BLOCKER')">BLOCKER</button>
  <button onclick="toggleTag(this,'RUSH')">RUSH</button>
  <button onclick="toggleTag(this,'UNBLOCKABLE')">UNBLOCKABLE</button>
  <button onclick="toggleTag(this,'DOUBLE_ATTACK')">DOUBLE_ATTACK</button>
  <button onclick="toggleTag(this,'ON_KO')">ON K.O.</button>
  <button onclick="toggleTag(this,'ADD_DON')">Add DON!!</button>
  <button onclick="toggleTag(this,'ADD_LIFE')">Add Life</button>
  <button onclick="toggleTag(this,'COUNTER2000')">+2000</button>
  <button onclick="toggleTag(this,'COUNTER1000')">+1000</button>
  <button class="secondary" onclick="clearTags()">Clear Tags</button>
</div>

<div class="toolbar">
  <span style="color:var(--muted);font-size:0.85em;">Sort:</span>
  <button onclick="setSort('cost')">Cost</button>
  <button onclick="setSort('power')">Power</button>
  <button onclick="setSort('counter')">Counter</button>
  <button class="secondary" onclick="setSort('')">Default</button>
</div>

<div class="sidebar">
  <div>
    <div class="panel" id="set-aside">
      <h3>Set Aside</h3>
      <div id="set-aside-list" style="font-size:0.85em;color:var(--muted);">Click × on a card to set it aside.</div>
    </div>
    <div class="panel" style="margin-top:12px;" id="deck-panel">
      <h3>Deck <span id="deck-count" style="color:var(--gold);">0</span></h3>
      <div id="deck-list" style="font-size:0.8em;"></div>
      <button class="secondary" style="margin-top:8px;" onclick="copyDeck()">Copy OPTCGSim</button>
      <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
        <button class="secondary" onclick="saveState()">Save State</button>
        <button class="secondary" onclick="loadState()">Load State</button>
      </div>
    </div>
  </div>

  <div id="cards"></div>

  <div class="panel" id="types-panel">
    <h3>Types in View</h3>
    <div id="types-list"></div>
  </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modal-img" src="" alt="">
</div>

<script>
let allCards = [];
let setAside = new Set();
let deck = [];
let activeBlocks = new Set();
let activeColors = new Set();
let activeCats = new Set();
let activeTags = new Set();
let sortKey = '';

async function load() {
  const res = await fetch('data/cards.csv');
  const text = await res.text();
  const lines = text.split('\n').slice(1).filter(l => l.trim());
  const parsed = lines.map(parseCSVLine).filter(c => c && c.id);
  const byBase = {};
  parsed.forEach(c => {
    const base = c.id.replace(/_p\d+$/, '');
    if (!byBase[base] || !c.id.includes('_p')) byBase[base] = c;
  });
  allCards = Object.values(byBase);
  render();
}

function parseCSVLine(line) {
  const result = [];
  let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') inQuotes = !inQuotes;
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else current += ch;
  }
  result.push(current);
  if (result.length < 12) return null;
  return {
    id: result[0], name: result[1], category: result[2], colors: result[3],
    cost: result[4], power: result[5], counter: result[6], effect: result[7],
    tags: result[8] || '', blockIcon: result[9] || '', imageUrl: result[10],
    types: result[11] || ''
  };
}

function visibleCards() {
  const search = document.getElementById('search').value.toLowerCase();
  return allCards.filter(c => {
    if (setAside.has(c.id)) return false;
    if (activeBlocks.size && !activeBlocks.has(c.blockIcon)) return false;
    const colors = (c.colors || '').split('|');
    if (activeColors.size && !colors.some(col => activeColors.has(col))) return false;
    if (activeCats.size && !activeCats.has((c.category || '').toUpperCase())) return false;
    const tags = (c.tags || '').split(',').filter(Boolean);
    const eff = (c.effect || '').toLowerCase();
    if (activeTags.size && ![...activeTags].every(t => {
      if (t === 'ON_KO') return eff.includes('on k.o.');
      if (t === 'ADD_DON') return eff.includes('don!! deck') && (eff.includes('add') || eff.includes('set it as active'));
      if (t === 'ADD_LIFE') return eff.includes('life cards') && eff.includes('add');
      return tags.includes(t);
    })) return false;
    if (search && !(c.id + c.name + c.effect).toLowerCase().includes(search)) return false;
    return true;
  });
}

function render() {
  let cards = visibleCards();
  if (sortKey) {
    cards.sort((a, b) => {
      const av = parseFloat(a[sortKey]) || 0;
      const bv = parseFloat(b[sortKey]) || 0;
      return bv - av;
    });
  }
  const container = document.getElementById('cards');
  container.innerHTML = '';
  cards.forEach(c => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = c.id;
    const tags = (c.tags || '').split(',').filter(Boolean);
    const imgSrc = `https://optcg-api.arjunbansal-ai.workers.dev/images/${c.id}`;
    div.innerHTML = `
      <img class="thumb" src="${imgSrc}" alt="${c.name}" onclick="openModal('${imgSrc}')">
      <div class="card-body">
        <div class="card-header">
          <div>
            <span class="card-id">${c.id}</span>
            <span class="card-name">${c.name}</span>
            <span class="block-badge">B${c.blockIcon || '?'}</span>
          </div>
          <div class="card-actions">
            <button onclick="this.closest('.card').classList.toggle('minimized')">−</button>
            <button onclick="setAsideCard('${c.id}')">×</button>
            <button onclick="addToDeck('${c.id}')">+Deck</button>
          </div>
        </div>
        <div class="meta">${c.category || ''} · ${c.cost || '?'}c · ${c.power || '?'} · ${c.counter || '—'} · ${c.colors}</div>
        <div class="badges">${tags.map(t => `<span class="badge">${t}</span>`).join('')}</div>
        <div class="card-text">${c.effect || ''}</div>
      </div>`;
    container.appendChild(div);
  });
  renderSetAside();
  renderDeck();
  renderTypes(cards);
}

function setAsideCard(id) {
  setAside.add(id);
  render();
}
function restoreCard(id) {
  setAside.delete(id);
  render();
}
function renderSetAside() {
  const el = document.getElementById('set-aside-list');
  if (!setAside.size) { el.innerHTML = '<div style="color:var(--muted);">None</div>'; return; }
  el.innerHTML = [...setAside].map(id => {
    const c = allCards.find(x => x.id === id);
    if (!c) return '';
    return `<div class="side-item" onclick="restoreCard('${id}')">${c.id} · ${c.name} · ${c.cost || '?'}c · ${c.colors}</div>`;
  }).join('');
}

function addToDeck(id) {
  const existing = deck.find(d => d.id === id);
  if (existing) existing.qty = Math.min(4, existing.qty + 1);
  else deck.push({ id, qty: 1 });
  renderDeck();
}
function renderDeck() {
  document.getElementById('deck-count').textContent = deck.reduce((s, d) => s + d.qty, 0);
  document.getElementById('deck-list').innerHTML = deck.map(d => {
    const c = allCards.find(x => x.id === d.id);
    return `<div class="side-item">${d.qty}x ${d.id} ${c ? c.name : ''}</div>`;
  }).join('') || '<div style="color:var(--muted);">Empty</div>';
}
function copyDeck() {
  const text = deck.map(d => `${d.qty}x${d.id}`).join('\n');
  navigator.clipboard.writeText(text).then(() => alert('Copied ' + deck.length + ' unique cards'));
}

function renderTypes(cards) {
  const counts = {};
  cards.forEach(c => {
    (c.types || '').split('|').filter(Boolean).forEach(t => {
      counts[t] = (counts[t] || 0) + 1;
    });
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  document.getElementById('types-list').innerHTML = sorted.slice(0, 40).map(([t, n]) =>
    `<div class="type-row"><span>${t}</span><span class="type-count">${n}</span></div>`
  ).join('') || '<div style="color:var(--muted);">None</div>';
}

function toggleBlock(btn, b) { btn.classList.toggle('active'); if (activeBlocks.has(b)) activeBlocks.delete(b); else activeBlocks.add(b); render(); }
function toggleColor(btn, c) { btn.classList.toggle('active'); if (activeColors.has(c)) activeColors.delete(c); else activeColors.add(c); render(); }
function toggleCat(btn, c) { btn.classList.toggle('active'); if (activeCats.has(c)) activeCats.delete(c); else activeCats.add(c); render(); }
function toggleTag(btn, t) { btn.classList.toggle('active'); if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t); render(); }
function clearBlocks() { activeBlocks.clear(); document.querySelectorAll('#block-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearColors() { activeColors.clear(); document.querySelectorAll('#color-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearCats() { activeCats.clear(); document.querySelectorAll('#cat-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearTags() { activeTags.clear(); document.querySelectorAll('#tag-filter button').forEach(b => b.classList.remove('active')); render(); }
function clearSearch() { document.getElementById('search').value = ''; render(); }
function setSort(k) { sortKey = k; render(); }
function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

load();

const WORKER = "https://optcg-state.46jwnf9v56.workers.dev";

function collectState() {
  return {
    setAside: [...setAside],
    deck,
    activeBlocks: [...activeBlocks],
    activeColors: [...activeColors],
    activeCats: [...activeCats],
    activeTags: [...activeTags],
    sortKey,
    search: document.getElementById('search')?.value || ''
  };
}

function applyState(s) {
  if (!s) return;
  setAside = new Set(s.setAside || []);
  deck = s.deck || [];
  activeBlocks = new Set(s.activeBlocks || []);
  activeColors = new Set(s.activeColors || []);
  activeCats = new Set(s.activeCats || []);
  activeTags = new Set(s.activeTags || []);
  sortKey = s.sortKey || '';
  if (document.getElementById('search')) document.getElementById('search').value = s.search || '';
  // refresh button active classes
  document.querySelectorAll('#block-filter button').forEach(b => b.classList.toggle('active', activeBlocks.has(b.textContent.trim())));
  document.querySelectorAll('#color-filter button').forEach(b => b.classList.toggle('active', activeColors.has(b.textContent.trim())));
  document.querySelectorAll('#cat-filter button').forEach(b => b.classList.toggle('active', activeCats.has(b.textContent.trim())));
  document.querySelectorAll('#tag-filter button').forEach(b => b.classList.toggle('active', activeTags.has(b.textContent.trim())));
  render();
}

async function saveState() {
  const password = prompt("Password:");
  if (!password) return;
  const name = prompt("State name (letters, numbers, _ -):", "default");
  if (!name) return;
  const state = collectState();
  try {
    const res = await fetch(WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password, name, state })
    });
    const data = await res.json();
    if (res.ok) alert("Saved as " + data.name);
    else alert("Save failed: " + (data.error || res.status));
  } catch (e) {
    alert("Save error: " + e.message);
  }
}

async function loadState() {
  const password = prompt("Password:");
  if (!password) return;
  const name = prompt("State name to load:", "default");
  if (!name) return;
  try {
    const res = await fetch(WORKER + "?name=" + encodeURIComponent(name) + "&password=" + encodeURIComponent(password));
    const data = await res.json();
    if (res.ok) {
      applyState(data.state);
      alert("Loaded " + data.name);
    } else alert("Load failed: " + (data.error || res.status));
  } catch (e) {
    alert("Load error: " + e.message);
  }
}

</script>
</body>
</html>
